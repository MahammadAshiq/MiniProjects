<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors Pro</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- Animated Background -->
    <div class="background">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
    </div>

    <div class="container">

        <!-- Header -->

        <header>

            <h1>🪨 Rock Paper Scissors Pro ✂️</h1>

            <p>
                Challenge the Computer • Save Your Best Score • Play Again and Again
            </p>

        </header>

        <!-- Statistics -->

        <section class="stats">

            <div class="stat-card">

                <h2 id="wins">0</h2>

                <span>Wins</span>

            </div>

            <div class="stat-card">

                <h2 id="losses">0</h2>

                <span>Losses</span>

            </div>

            <div class="stat-card">

                <h2 id="ties">0</h2>

                <span>Ties</span>

            </div>

            <div class="stat-card">

                <h2 id="games">0</h2>

                <span>Games</span>

            </div>

        </section>

        <!-- Arena -->

        <section class="arena">

            <div class="player">

                <div
                     class="choice-box"
                     id="playerChoice">

                    ❔

                </div>

                <h3>You</h3>

            </div>

            <div class="middle">

                <h2>VS</h2>

                <div
                     id="result">

                    Make Your Move!

                </div>

            </div>

            <div class="player">

                <div
                     class="choice-box"
                     id="computerChoice">

                    ❔

                </div>

                <h3>Computer</h3>

            </div>

        </section>

        <!-- Buttons -->

        <section class="buttons">

            <button
                    onclick="play('rock')">

                🪨

                <span>Rock</span>

            </button>

            <button
                    onclick="play('paper')">

                📄

                <span>Paper</span>

            </button>

            <button
                    onclick="play('scissors')">

                ✂️

                <span>Scissors</span>

            </button>

        </section>

        <!-- Statistics Panel -->

        <section class="extra">

            <div>

                <h4>Current Streak</h4>

                <p id="streak">0</p>

            </div>

            <div>

                <h4>Best Streak</h4>

                <p id="best">0</p>

            </div>

            <div>

                <h4>Win Rate</h4>

                <p id="rate">0%</p>

            </div>

        </section>

        <!-- Match History -->

        <section class="history">

            <h2>

                Match History

            </h2>

            <ul id="historyList">

                <li>

                    No games played yet.

                </li>

            </ul>

        </section>

        <!-- Controls -->

        <section class="controls">

            <button
                    id="soundBtn">

                🔊 Sound ON

            </button>

            <button
                    onclick="resetGame()">

                🔄 Reset

            </button>

        </section>

    </div>

    <canvas id="confetti"></canvas>

    <script src="script.js"></script>

</body>

</html>
